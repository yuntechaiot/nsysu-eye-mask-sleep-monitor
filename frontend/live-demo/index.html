<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本機真實 LINE Demo</title><style>body{font-family:system-ui,sans-serif;max-width:52rem;margin:2rem auto;padding:1rem;background:#f5f5f7;color:#1d1d1f}button,input{font:inherit;min-height:3rem;padding:.7rem;border-radius:.6rem;border:1px solid #aaa}button{cursor:pointer;margin:.5rem .25rem .5rem 0;background:#0071e3;color:white;border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.notice{background:#fff2d4;padding:1rem;border-radius:1rem}label{display:block;margin:1.5rem 0 .5rem}a{color:#0071e3}</style></head><body><h1>本機真實 LINE Demo</h1><p class="notice">這裡會向指定測試者的 LINE 發出真實訊息。研究帳號與日誌資料只在隔離資料庫，不連正式研究資料。此控制頁不公開到 HTTPS 測試入口。</p><p>手機操作：加入官方 LINE → 傳送「開始綁定」→ 點官方訊息連結 → 輸入指定研究測試帳密 → 綁定成功。</p><p id="ready" role="status"></p><p id="entry"></p><label for="clock">台灣測試時鐘</label><input id="clock" type="datetime-local" value="2026-11-17T23:59"><button onclick="act('clock',{value:document.getElementById('clock').value})">設定測試時間</button><button onclick="act('tick')">執行真實 LINE 提醒檢查</button><button onclick="refresh()">更新結果</button><p id="result" role="status"></p><pre id="state"></pre><script>
const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='查看本機研究測試帳密';const access=document.createElement('pre');details.append(summary,access);document.querySelector('h1').after(details);details.addEventListener('toggle',async()=>{if(details.open){const r=await fetch('/access');const a=await r.json();access.textContent='研究帳號：'+a.account+'\n研究密碼：'+a.password;}});
async function refresh(){const r=await fetch('/state');const s=await r.json();document.getElementById('ready').textContent='必要設定：'+JSON.stringify(s.configured);document.getElementById('entry').textContent=s.public_origin?'目前 HTTPS 測試入口：'+s.public_origin:'HTTPS 入口尚未設定';document.getElementById('state').textContent=JSON.stringify(s,null,2);}
async function act(action,more={}){const r=await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...more})});document.getElementById('result').textContent=JSON.stringify(await r.json());await refresh();}refresh();
</script></body></html>
