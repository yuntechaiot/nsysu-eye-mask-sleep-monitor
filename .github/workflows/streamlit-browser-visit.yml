name: Streamlit browser visit

on:
  schedule:
    # Every 4 hours, away from the busy start of the hour. Times are UTC.
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      attempts:
        description: Maximum attempts per app
        type: choice
        default: '2'
        options: ['2', '1']

permissions:
  contents: read

concurrency:
  group: streamlit-browser-visit
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-keepalive.txt

      - name: Install browser dependencies only
        run: |
          python -m pip install -r tools/requirements-keepalive.txt
          python -m playwright install --with-deps chromium

      - name: Verify wake handling with local fixtures
        run: python tools/test_streamlit_browser_visit.py

      - name: Open public homepages and verify Streamlit sessions
        env:
          VISIT_ATTEMPTS: ${{ inputs.attempts || '2' }}
        run: xvfb-run -a python tools/streamlit_browser_visit.py --headed --attempts "$VISIT_ATTEMPTS"

      - name: Save visit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: streamlit-browser-visit-report
          path: test-results/streamlit-browser-visit/report.json
          if-no-files-found: warn
          retention-days: 7
