<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f5f5f7"><title>研究帳號綁定｜NSYSU</title><link rel="stylesheet" href="/line/bind.css"><script src="/line/bind.js" defer></script></head>
<body><main><a class="brand" href="#">☾ 深睡體驗營</a><h1>研究帳號綁定</h1><p>請輸入研究配發的 Docter+ 帳號與密碼。</p><p class="test" id="test-label" hidden>隔離測試模式・不發送真實 LINE 訊息</p><p id="identity-status" role="status">正在確認 LINE 身分…</p><form id="bind-form"><label for="account">研究帳號</label><input id="account" name="account" placeholder="例如 ycc00000001" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="32"><label for="password">研究密碼</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button id="bind-button" disabled>確認綁定</button></form><p id="error" role="alert" hidden></p><section id="success" tabindex="-1" hidden><h2>綁定成功</h2><p id="first-reminder"></p><p>日誌連結將由官方 LINE 提供。現在可以返回 LINE。</p></section><button id="retry" class="secondary" type="button" hidden>重新確認 LINE 身分</button><p class="note">本頁進行研究帳號核對與 LINE 綁定。</p></main></body></html>
