<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隔離驗收工具</title><link rel="stylesheet" href="/line/bind.css"></head><body><main style="max-width:55rem"><h1>隔離驗收工具</h1><p class="test">合成資料與 LINE 測試替身。所有操作僅作用於此電腦的隔離資料庫，真實發送為 0。</p><p><a href="/" target="_blank">開啟實際網站</a>　<a href="/line" target="_blank">開啟專用綁定頁</a></p><details><summary>查看本機測試登入資料</summary><pre id="access" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></details><label for="clock">測試時鐘（台灣時間）</label><input id="clock" type="datetime-local" value="2026-11-17T23:59"><button onclick="act('clock',{value:document.getElementById('clock').value})">設定測試時間</button><button onclick="act('follow')">模擬加入官方 LINE</button><button onclick="act('command')">模擬傳送「開始綁定」</button><button onclick="act('tick')">執行一次提醒工作</button><button class="secondary" onclick="act('unfollow')">模擬封鎖</button><button class="secondary" onclick="act('revoke_session')">撤銷測試管理者 Session</button><p id="result" role="status"></p><h2>實際處理結果</h2><p id="now"></p><div id="jobs"></div><button class="secondary" onclick="refresh()">重新讀取結果</button><p class="note">建議流程：11/17 23:59 加好友並綁定 → 11/18 09:00 執行 → 11:00 再執行 → 開啟訊息中的日誌連結並正式送出 → 13:00 執行，確認不再提醒。可改用 10:30 完成後檢查 11:00。重測完整綁定請使用新的隔離資料目錄，或由開發者重建測試資料。</p></main><script>
async function act(action,extra={}){const r=await fetch('/acceptance/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});const data=await r.json();document.getElementById('result').textContent=JSON.stringify(data);await refresh();}
async function refresh(){const data=await(await fetch('/acceptance/state')).json();document.getElementById('now').textContent='台灣測試時間：'+data.clock+'；正式提交 '+data.submitted.length+' 筆';const box=document.getElementById('jobs');box.replaceChildren();for(const job of data.jobs){const p=document.createElement('p');p.textContent=`${job.kind==='welcome'?'綁定邀請':job.target_date+' '+job.slot}：${job.status}（合成 LINE API） `;const msg=JSON.parse(job.payload);const uri=msg.messages[0].template.actions[0].uri;const a=document.createElement('a');a.href=uri;a.textContent=job.kind==='welcome'?'開始綁定':'填寫睡眠日誌';a.target='_blank';p.append(a);box.append(p);}}
fetch('/acceptance/access').then(r=>r.json()).then(data=>{document.getElementById('access').textContent='管理者帳號：'+data.admin_account+'\n管理者密碼：'+data.admin_password+'\n研究帳號：'+data.research_account+'\n研究密碼：'+data.research_password+'\n邊界測試帳號：'+data.boundary_account+'\n邊界測試密碼：'+data.boundary_password;});refresh();
</script></body></html>
